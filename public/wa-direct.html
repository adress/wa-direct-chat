<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Direct Message</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <svg class="header__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <h1 class="header__title">Direct Message</h1>
    </header>

    <form class="form" id="waForm">
      <div class="form__row form__row--two-col">
        <div class="form__field">
          <label class="form__label" for="typeWa">Platform</label>
          <select class="form__select" id="typeWa">
            <option selected value="web">WhatsApp Web</option>
            <option value="desktop">Desktop</option>
          </select>
        </div>
        <div class="form__field">
          <label class="form__label" for="countryCodeWA">Country</label>
          <select class="form__select" id="countryCodeWA">
            <option selected value="57">🇨🇴 +57</option>
            <option value="1">🇺🇸 +1</option>
            <option value="52">🇲🇽 +52</option>
            <option value="34">🇪🇸 +34</option>
            <option value="54">🇦🇷 +54</option>
            <option value="56">🇨🇱 +56</option>
            <option value="51">🇵🇪 +51</option>
            <option value="58">🇻🇪 +58</option>
            <option value="55">🇧🇷 +55</option>
          </select>
        </div>
      </div>

      <div class="form__field">
        <label class="form__label" for="phoneNumberWA">Phone number</label>
        <input class="form__input" type="number" placeholder="3001234567" id="phoneNumberWA">
      </div>

      <div class="form__field">
        <label class="form__label" for="messageWA">Message</label>
        <textarea class="form__textarea" id="messageWA" rows="4" placeholder="Type your message..."></textarea>
      </div>

      <button class="btn-send" id="sendMessageWA" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
        Send message
      </button>
    </form>
  </div>

  <script src="popup.js"></script>
</body>

</html>
